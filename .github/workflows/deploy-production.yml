name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to beauteinee.fr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://beauteinee.fr

    env:
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_PORT: ${{ vars.PRODUCTION_PORT }}
      PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
      PRODUCTION_CONFIGURED_PATH: ${{ vars.PRODUCTION_PATH }}

    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${PRODUCTION_HOST:?Missing PRODUCTION_HOST environment variable}"
          : "${PRODUCTION_PORT:?Missing PRODUCTION_PORT environment variable}"
          : "${PRODUCTION_USER:?Missing PRODUCTION_USER environment variable}"
          : "${PRODUCTION_CONFIGURED_PATH:?Missing PRODUCTION_PATH environment variable}"
          [[ "$PRODUCTION_PORT" =~ ^[0-9]+$ ]]
          [[ "$PRODUCTION_CONFIGURED_PATH" == /* ]]

          configured_path="${PRODUCTION_CONFIGURED_PATH%/}"
          if [[ "$configured_path" == */domains/beauteinee.fr/public_html ]]; then
            deployment_path="$configured_path"
          elif [[ "$configured_path" == */domains/beauteinee.fr ]]; then
            deployment_path="$configured_path/public_html"
          else
            echo 'PRODUCTION_PATH must target the beauteinee.fr domain root or its public_html directory.' >&2
            exit 1
          fi

          printf 'PRODUCTION_PATH=%s\n' "$deployment_path" >> "$GITHUB_ENV"
          echo "Deployment target: $deployment_path"
          test -f index.php
          test -f config.php
          test -f coming.php

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_KNOWN_HOSTS secret}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Check the remote legacy application
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$PRODUCTION_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "test -d '$PRODUCTION_PATH' && \
             test -f '$PRODUCTION_PATH/index.php' && \
             test -f '$PRODUCTION_PATH/config.php'"

      - name: Synchronize the legacy application
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync \
            --archive \
            --compress \
            --exclude='*.env.local' \
            --exclude='.env*' \
            --exclude='.user.ini' \
            --exclude='error_log' \
            --rsh="ssh -p $PRODUCTION_PORT" \
            cgu.php \
            coming.php \
            config.php \
            footer.php \
            head.php \
            header.php \
            index.php \
            leads_form.php \
            legacy.php \
            modals.php \
            return_policy.php \
            sitemap.php \
            css \
            fonts \
            images \
            js \
            php \
            video \
            "$PRODUCTION_USER@$PRODUCTION_HOST:${PRODUCTION_PATH%/}/"

      - name: Validate deployed PHP files
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$PRODUCTION_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "php -l '$PRODUCTION_PATH/index.php' && \
             php -l '$PRODUCTION_PATH/config.php' && \
             php -l '$PRODUCTION_PATH/coming.php'"

      - name: Verify the production website
        shell: bash
        run: |
          set -Eeuo pipefail
          homepage="$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            --header 'Cache-Control: no-cache' \
            "https://beauteinee.fr/?deployment=$GITHUB_SHA")"
          grep -Fq 'https://www.sumupbookings.com/beaute-inee' <<< "$homepage"
          grep -Fq 'Skinconsultation de peau' <<< "$homepage"
          if grep -Fq 'booking.booxi.com' <<< "$homepage"; then
            echo 'The previous Booxi booking link is still present in production.' >&2
            exit 1
          fi
